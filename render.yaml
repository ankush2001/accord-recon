# Render Blueprint.
#
# Postgres lives on Neon rather than Render: Render's free Postgres expires 30
# days after creation and is then deleted with all its data, which is no use
# for a link that has to keep working. See DEPLOY.md.

services:
  - type: web
    name: accord-recon
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Paste Neon's connection string unedited -- postgresql:// and
      # postgres:// are both rewritten to name the psycopg driver at startup.
      - key: ACCORD_DATABASE_URL
        sync: false

      # The account being reconciled. A statement covers one bank account, so
      # this must match the ledger account whose postings are being compared.
      - key: ACCORD_RECONCILED_ACCOUNT
        value: asset:bank

      # Shared secret the ledger's outbox relay presents. Generated by Render
      # and copied into the ledger's OUTBOX_SIGNATURE. Without it the ingest
      # endpoint is open, and a reconciliation against injected entries would
      # cheerfully report all clear.
      - key: ACCORD_WEBHOOK_SECRET
        generateValue: true

      # Settlement lands a day or two after the ledger posts; beyond two days
      # a match is still made but flagged as a timing break.
      - key: ACCORD_DATE_WINDOW_DAYS
        value: "3"
      - key: ACCORD_TIMING_BREAK_AFTER_DAYS
        value: "2"

      # One worker. On 512MB a second doubles memory for no throughput: every
      # request here waits on Postgres, not on Python.
      - key: WEB_CONCURRENCY
        value: "1"
