name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      # Postgres comes from Testcontainers, which uses the runner's own Docker.
      - name: Test
        run: uv run pytest -v

  migrations:
    name: Migrations apply to an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accord"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      ACCORD_DATABASE_URL: postgresql+psycopg://accord:accord@localhost:5432/accord

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: Upgrade
        run: uv run alembic upgrade head

      # The tests build their schema with create_all, so a migration could
      # drift from the models without a single test failing. This catches it:
      # after upgrading, autogenerate must find nothing left to do.
      - name: The migrations match the models
        run: |
          uv run alembic revision --autogenerate -m "drift check" --rev-id driftcheck
          if grep -qE "op\.(create|drop|add|alter)_" alembic/versions/driftcheck_*.py; then
            echo "::error::models and migrations have diverged — run alembic revision --autogenerate"
            cat alembic/versions/driftcheck_*.py
            exit 1
          fi
          echo "no drift"

      - name: Downgrade cleanly
        run: uv run alembic downgrade base

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
